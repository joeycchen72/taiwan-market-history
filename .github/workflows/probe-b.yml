name: probe-b (temporary)
on:
  push:
    branches: [claude/probe-b]
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/probe-b.mjs > probe-b.txt 2>&1 || true
      - run: |
          git config user.name probe-bot && git config user.email probe-bot@users.noreply.github.com
          git add probe-b.txt && git commit -m "probe output [skip ci]" && git push
