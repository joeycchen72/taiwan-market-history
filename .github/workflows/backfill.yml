name: Backfill official daily quotes
on:
  workflow_dispatch:
    inputs:
      max_requests:
        description: 'Requests this run (2 per trading day)'
        default: '750'
      start:
        description: 'Earliest date to fetch (YYYY-MM-DD)'
        default: '2014-01-01'
  schedule:
    # Once per weekday morning (06:43 Taipei, Mon-Fri = 22:43 UTC Sun-Thu); also runs the B-class fetch below.
    # Moved from 16:43 on 2026-11-12 at the owner's request: the previous day's official files are complete by then,
    # and even with GitHub's ~1 h start delay the lists are sealed before the 09:00 deadline. Still one run per weekday.
    - cron: '43 22 * * 0-4'
permissions:
  contents: write
concurrency:
  group: backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Parser tests
        run: node tests/parse.test.mjs && node tests/research.test.mjs
      - name: Fetch a polite batch (newest first, resumable)
        env:
          MAX_REQUESTS: ${{ github.event.inputs.max_requests || '750' }}
          START: ${{ github.event.inputs.start || '2014-01-01' }}
          DELAY_MS: '4000'
        run: node scripts/backfill.mjs
      - name: Forward H5 list (seal on a month's first trading day before the next open; evaluate matured lists)
        continue-on-error: true
        run: node research/forward-h5.mjs
      - name: B-class data on formation dates (was the separate hourly b-backfill job)
        continue-on-error: true
        run: node tests/fetch-b.test.mjs && node scripts/fetch-b.mjs
      - name: Forward B2/B4 lists (seal on the formation date before the next open; evaluate matured lists)
        continue-on-error: true
        run: node research/forward-b.mjs
      - name: P1 experimental account (failed the ten-year test; watched only)
        continue-on-error: true
        run: node tests/p1-account.test.mjs && node research/p1-account.mjs
      - name: Commit data and progress
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data research/forward
          git diff --cached --quiet || git commit -m "Backfill batch ${GITHUB_RUN_ID}"
          # main may have moved (e.g. a merged PR) while this batch ran: replay the data commit on top, retry once
          git pull --rebase origin main || { git rebase --abort; exit 1; }
          git push origin HEAD:main || { sleep 10; git pull --rebase origin main && git push origin HEAD:main; }
